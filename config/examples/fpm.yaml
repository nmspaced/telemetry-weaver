# PHP-FPM, or FrankenPHP with FRANKENPHP_RESET_KERNEL=1. SDK settings: fpm.env.
open_telemetry:
    runtime:
        request_metrics:
            # One DELTA stream per FPM child. A cumulative backend (Prometheus, Mimir) needs the
            # collector's deltatocumulative processor: collector.yaml.
            mode: delta

    sdk:
        export:
            # The export runs after the response but holds the FPM child, and a collector's
            # cooldown does not outlive the request. Keep the per-request worst case short.
            flush_timeout_ms: 250
