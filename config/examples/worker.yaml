# Production-oriented long-lived worker example.
# SDK/export endpoint, protocol, sampler and queue sizes belong in OTEL_* variables.
open_telemetry:
    instrumentation:
        # Serializer spans can be noisy. Metrics are often enough for capacity work.
        serializer:
            traces: false
            metrics: true

    sdk:
        export:
            # Total time one execution boundary may spend in the default export path.
            flush_timeout_ms: 1000
            failure_cooldown_ms: 30000

            # Do not synchronously retry inside the PHP worker.
            max_retries: 0
