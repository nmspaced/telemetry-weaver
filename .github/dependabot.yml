version: 2

updates:
  # composer.json carries ranges and no lock file, so Composer updates would only ever churn
  # the manifest's floors. Mago is the exception: it ships new analyzer rules almost daily,
  # so it is pinned exactly, and a bump arrives here as a pull request CI has checked.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    allow:
      - dependency-name: carthage-software/mago

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns:
          - '*'
